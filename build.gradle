plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = '0.2.0'
group = 'dev.structurelab'
base { archivesName = 'structurelab-26.2' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()
repositories { mavenCentral() }
neoForge {
    version = '26.1.2.106'
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { structurelab { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
