plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
version = '0.2.0'
group = 'dev.structurelab'
base { archivesName = 'structurelab-26.1.2' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
java.withSourcesJar()
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
// Jade is only compiled against, so LabJade can read its tooltips. Structure Lab still loads without Jade.
dependencies { compileOnly 'maven.modrinth:jade:26.1.12+neoforge' }
neoForge {
    version = '26.1.2.106'
    runs { client { client() }; server { server(); programArgument '--nogui' } }
    mods { structurelab { sourceSet(sourceSets.main) } }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
